name: MiniAssist Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniassist-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle || test -f build.gradle.kts || { echo "ERROR: Gradle build file must be in repository root."; exit 1; }
          test -d src/main || { echo "ERROR: src/main is missing from repository root."; exit 1; }
          test -f src/main/resources/fabric.mod.json || { echo "ERROR: fabric.mod.json is missing."; exit 1; }
          echo "Project root: $GITHUB_WORKSPACE"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Gradle: $(gradle --version | grep '^Gradle ' | head -1)"

      - name: Build MiniAssist
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all clean build 2>&1 | tee "$RUNNER_TEMP/miniassist-build.log"

      - name: Verify and prepare JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR_FILE="build/libs/zenith-client-1.4.1.jar"
          if [ ! -s "$JAR_FILE" ]; then
            echo "ERROR: expected JAR not found: $JAR_FILE"
            echo "Available build outputs:"
            find build -maxdepth 4 -type f -name '*.jar' -print 2>/dev/null || true
            exit 1
          fi
          jar tf "$JAR_FILE" > "$RUNNER_TEMP/miniassist-jar-contents.txt"
          grep -Fxq 'fabric.mod.json' "$RUNNER_TEMP/miniassist-jar-contents.txt"
          unzip -p "$JAR_FILE" fabric.mod.json | grep -Fq '"version": "1.4.1"'
          mkdir -p artifacts
          cp "$JAR_FILE" artifacts/zenith-client-1.4.1.jar
          echo "Verified: artifacts/zenith-client-1.4.1.jar"

      - name: Upload MiniAssist JAR
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-1.4.1
          path: artifacts/zenith-client-1.4.1.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiniAssist-build-log
          path: ${{ runner.temp }}/miniassist-build.log
          if-no-files-found: ignore
          retention-days: 7
